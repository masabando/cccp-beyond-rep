<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure 1 - Fidelity maps</title>
  <script type="importmap">
    {
      "imports": {
        "@masabando/quantum-gates": "https://cdn.jsdelivr.net/npm/@masabando/quantum-gates@0.1.13/+esm"
      }
    }
  </script>
  <style>
    body { margin: 24px; background: white; color: black; font-family: serif; }
    main { display: grid; grid-template-columns: 520fr 520fr 668fr; gap: 24px 8px; max-width: 1200px; margin: auto; }
    figure { margin: 0; min-width: 0; }
    figure div { font-size: 0; }
    canvas { display: block; width: 100%; height: auto; }
    figcaption { text-align: center; font-size: 16px; overflow-wrap: anywhere; margin-top: 8px; }
    @media (max-width: 640px) {
      body { margin: 12px; }
      main { grid-template-columns: 1fr; }
      figure { width: 100%; max-width: 520px; margin: auto; }
    }
  </style>
</head>
<body>
  <main>
    <figure><div id="CORPSE_BB1"></div><figcaption>(a) CORPSE/BB1</figcaption></figure>
    <figure><div id="shortCORPSE_BB1"></div><figcaption>(b) shortCORPSE/BB1</figcaption></figure>
    <figure><div id="shortCORPSE_splitBB1"></div><figcaption>(c) shortCORPSE/splitBB1</figcaption></figure>
    <figure><div id="SCROFULOUS"></div><figcaption>(d) SCROFULOUS</figcaption></figure>
    <figure><div id="splitShortCORPSE"></div><figcaption>(e) splitShortCORPSE</figcaption></figure>
    <figure><div id="SCROFULOUS_splitShortCORPSE"></div><figcaption>(f) SCROFULOUS/splitShortCORPSE</figcaption></figure>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
